[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "local-voice-studio"
version = "1.0.0"
description = "本地声音工坊 - Windows 本地声音克隆与文字转语音桌面程序"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = ["PySide6==6.9.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "pyinstaller==6.15.0"]

[project.scripts]
local-voice-studio = "local_voice_studio.app:main"
local-voice-worker = "local_voice_studio.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
