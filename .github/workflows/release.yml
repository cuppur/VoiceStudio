name: Signed Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.3.0
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  signed-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - name: Require signing secrets
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) { throw "Release signing secrets are required" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[dev]" cyclonedx-bom
      - name: Import release certificate
        id: certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP signing.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $secure = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Remove-Item -LiteralPath $pfx -Force
      - name: Build signed installer
        shell: pwsh
        run: ./scripts/build.ps1 -Release -CertificateThumbprint '${{ steps.certificate.outputs.thumbprint }}'
      - name: Verify signatures and create metadata
        shell: pwsh
        run: |
          $artifacts = @('dist/LocalVoiceStudio/LocalVoiceStudio.exe') + (Get-ChildItem dist/installer/*.exe | ForEach-Object FullName)
          foreach ($artifact in $artifacts) {
            if ((Get-AuthenticodeSignature $artifact).Status -ne 'Valid') { throw "Invalid signature: $artifact" }
          }
          ./scripts/create_release_metadata.ps1 -Artifact $artifacts
      - name: Create portable archive
        shell: pwsh
        run: Compress-Archive -Path dist/LocalVoiceStudio/* -DestinationPath dist/LocalVoiceStudio-portable.zip -Force
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/LocalVoiceStudio-portable.zip
            dist/installer/*.exe
            release-metadata/SHA256SUMS.txt
            release-metadata/sbom.cdx.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/LocalVoiceStudio-portable.zip
            dist/installer/*.exe
            release-metadata/SHA256SUMS.txt
            release-metadata/sbom.cdx.json
