name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_public_assets.py
      - run: python -m pytest
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }

  package-smoke:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Build unsigned development package
        shell: pwsh
        run: ./scripts/build.ps1 -SkipInstaller
      - name: Packaged EXE smoke test
        shell: pwsh
        run: |
          if (-not (Test-Path dist/LocalVoiceStudio/LocalVoiceStudio.exe)) { throw "Packaged EXE missing" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:LOCAL_VOICE_STUDIO_HOME = Join-Path $env:RUNNER_TEMP 'voice-studio-home'
          $env:LOCAL_VOICE_STUDIO_PROJECTS = Join-Path $env:RUNNER_TEMP 'voice-studio-projects'
          $process = Start-Process -FilePath (Resolve-Path dist/LocalVoiceStudio/LocalVoiceStudio.exe) -ArgumentList '--smoke-test' -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Packaged EXE smoke test failed with exit code $($process.ExitCode)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LocalVoiceStudio-unsigned-dev
          path: dist/LocalVoiceStudio
